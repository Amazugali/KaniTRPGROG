function row(r){const review=(r.system==='未分類'||r.confidence==='low')?'<span class="badge review">要確認</span>':'';return`<li class="room"><div class="room-title"><a href="${esc(r.link)}">${esc(r.title)}</a><div class="badges"><span class="badge">${esc(r.system)}</span><span class="badge">${esc(r.kind)}</span>${review}</div></div><div class="room-year">${r.year?esc(r.year)+'年':'年代不明'}</div><div class="room-date">${esc(r.created)}</div></li>`}
function bySys(rows){const g=new Map();for(const r of rows){if(!g.has(r.system))g.set(r.system,[]);g.get(r.system).push(r)}const ss=[...g.keys()].sort((a,b)=>(SYSTEM_ORDER.indexOf(a)<0?999:SYSTEM_ORDER.indexOf(a))-(SYSTEM_ORDER.indexOf(b)<0?999:SYSTEM_ORDER.indexOf(b)));return ss.map(s=>{const rs=newest(g.get(s)),ys=[...new Set(rs.map(r=>r.year??'不明'))].sort((a,b)=>a==='不明'?1:b==='不明'?-1:b-a);return`<section class="group"><h2 class="group-title">${esc(s)} <small>(${rs.length})</small></h2>${ys.map(y=>{const z=newest(rs.filter(r=>(r.year??'不明')===y));return`<h3 class="year-title">${y==='不明'?'年代不明':y+'年'} (${z.length})</h3><ul class="room-list">${z.map(row).join('')}</ul>`}).join('')}</section>`}).join('')}
function byYr(rows){const g=new Map();for(const r of rows){const y=r.year??'不明';if(!g.has(y))g.set(y,[]);g.get(y).push(r)}const ys=[...g.keys()].sort((a,b)=>a==='不明'?1:b==='不明'?-1:b-a);return ys.map(y=>`<section class="group"><h2 class="group-title">${y==='不明'?'年代不明':y+'年'} <small>(${g.get(y).length})</small></h2><ul class="room-list">${newest(g.get(y)).map(row).join('')}</ul></section>`).join('')}
function render(){const rows=filtered();summary.textContent=`${rows.length} / ${DATA.length} 部屋を表示`;catalog.innerHTML=mode==='system'?bySys(rows):byYr(rows)}
for(const e of[q,system,kind,year]){e.addEventListener('input',render);e.addEventListener('change',render)}bySystem.onclick=()=>{mode='system';bySystem.classList.add('active');byYear.classList.remove('active');render()};byYear.onclick=()=>{mode='year';byYear.classList.add('active');bySystem.classList.remove('active');render()};render();
</script></body></html>
