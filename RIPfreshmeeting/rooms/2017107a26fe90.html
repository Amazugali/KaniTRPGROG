<style>
:root {
  color-scheme: light;
  --green:#78bd45;
  --green-dark:#4b982a;
  --border:#d9ded5;
  --muted:#737b73;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:#f3f5f1;
  color:#242824;
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  line-height:1.65;
}
header {
  border-top:6px solid var(--green);
  background:#fff;
  border-bottom:1px solid var(--border);
}
.header-inner {
  max-width:1100px;
  margin:auto;
  padding:18px 18px 15px;
}
h1 {
  margin:0;
  font-size:22px;
  line-height:1.35;
}
.meta {
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
}
.intro {
  margin-top:12px;
  padding:10px 12px;
  background:#f7fbf4;
  border-left:4px solid var(--green);
  overflow-wrap:anywhere;
}
main {
  max-width:1100px;
  margin:18px auto 50px;
  padding:0 14px;
}
.attachment-warning {
  margin:0 0 14px;
  padding:10px 12px;
  background:#fff4d4;
  border:1px solid #e2c36d;
  border-radius:5px;
  font-size:13px;
}
.message {
  display:grid;
  grid-template-columns:150px minmax(0,1fr);
  background:#fff;
  border:1px solid var(--border);
  border-bottom:0;
}
.message:last-of-type { border-bottom:1px solid var(--border); }
.message:target { outline:3px solid #f0cf50; outline-offset:-3px; }
.speaker {
  display:flex;
  gap:8px;
  align-items:flex-start;
  padding:11px 10px;
  background:#f6f8f4;
  border-right:1px solid var(--border);
  overflow-wrap:anywhere;
}
.avatar {
  width:32px;
  height:32px;
  flex:0 0 32px;
  object-fit:cover;
  border-radius:3px;
}
.avatar-fallback {
  display:grid;
  place-items:center;
  background:#dce5d8;
  color:#43503e;
  font-weight:700;
}
.speaker strong {
  padding-top:4px;
  font-size:13px;
}
.message-main {
  min-width:0;
  padding:10px 12px 8px;
}
.message-body {
  overflow-wrap:anywhere;
  word-break:break-word;
}
.message-body img:not(.icon16) {
  max-width:min(100%,720px);
  height:auto;
}
.message-body a {
  color:#075cbd;
}
.message-time {
  margin-top:6px;
  color:#7c847b;
  font-size:11px;
  text-align:right;
}
.elapsed {
  text-align:center;
  color:#8a9188;
  font-size:11px;
  margin:9px 0;
}
.elapsed span {
  display:inline-block;
  background:#e8ece6;
  padding:2px 10px;
  border-radius:999px;
}
.footer-note {
  margin-top:18px;
  color:#6f766e;
  font-size:11px;
}
@media (max-width:650px) {
  .message { grid-template-columns:1fr; }
  .speaker {
    border-right:0;
    border-bottom:1px solid #e9ece7;
    padding:7px 9px;
    align-items:center;
  }
  .avatar { width:26px;height:26px;flex-basis:26px; }
  .speaker strong { padding-top:0; }
}
</style>
</head>
